<title>Shape Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="account-url" content="https://pb.jpzl.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a workshop bench. Shape bin on the left, build plate in the middle, measuring card on the right. Stacks on phones. */
:root {
  --bg: #e9edf1;
  --panel: #ffffff;
  --panel-2: #f4f6f8;
  --ink: #18212b;
  --muted: #5a6876;
  --line: #d3dae1;
  --accent: #e8551c;
  --accent-ink: #ffffff;
  --accent-soft: #fde6dc;
  --sel: #1f6fe0;
  --hole: #8b97a4;
  --stage: #dfe4e9;
  --plate: #f6f7f9;
  --grid-minor: #dde2e7;
  --grid-major: #b8c1cb;
  --warn: #a35a00;
  --ok: #2c8a3e;
  --bad: #c2321f;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --ink: #e6ebf0; --muted: #94a2b0; --line: #2b343e;
    --accent: #ff6a33; --accent-ink: #1a0d06; --accent-soft: #3a2117; --sel: #5b9bff; --hole: #7d8a97;
    --stage: #141a20; --plate: #1d242c; --grid-minor: #27303a; --grid-major: #3b4653; --warn: #f0a24a; --ok: #5cc272; --bad: #ff7a66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --panel: #192028; --panel-2: #1f2730; --ink: #e6ebf0; --muted: #94a2b0; --line: #2b343e;
  --accent: #ff6a33; --accent-ink: #1a0d06; --accent-soft: #3a2117; --sel: #5b9bff; --hole: #7d8a97;
  --stage: #141a20; --plate: #1d242c; --grid-minor: #27303a; --grid-major: #3b4653; --warn: #f0a24a; --ok: #5cc272; --bad: #ff7a66;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 13px; }
#projectName { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; min-width: 0; width: 190px; font-weight: 500; }
#projectName:hover, #projectName:focus { border-color: var(--line); background: var(--panel-2); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 4px 8px; font-size: 13px; }
.btn svg { width: 16px; height: 16px; }
.snap { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.snap select { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 5px 6px; }

main.work { display: grid; grid-template-columns: 208px minmax(0,1fr) 288px; min-height: 0; }
aside { background: var(--panel); overflow-y: auto; min-height: 0; }
aside.bin { border-right: 1px solid var(--line); padding: 14px 12px; }
aside.card { border-left: 1px solid var(--line); padding: 16px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; text-wrap: balance; }
.shapes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
.shape {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 4px 2px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; line-height: 1.15; text-align: center; user-select: none; touch-action: manipulation;
}
.shape:hover { border-color: var(--accent); background: var(--accent-soft); }
.shape img { width: 48px; height: 48px; pointer-events: none; }
details.grp { margin-bottom: 4px; }
details.grp > summary, h2.fold { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 2px; min-height: 36px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before, h2.fold::before { content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
details.grp[open] > summary::before, .section:not(.closed) > h2.fold::before { transform: rotate(45deg); }
details.grp > summary:hover, h2.fold:hover { color: var(--ink); }
details.grp > .shapes { margin-bottom: 10px; }
.section.closed > :not(h2) { display: none; }
h2.fold { margin: 0; }
.bin-note { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--stage); overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.float { position: absolute; display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.modes { top: 12px; left: 50%; transform: translateX(-50%); }
.views { bottom: 12px; left: 12px; }
.seg { border: 0; background: transparent; border-radius: 7px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.seg:hover { background: var(--panel-2); }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg kbd { font-family: var(--font-mono); font-size: 10.5px; opacity: .6; }
.seg svg { width: 16px; height: 16px; }
.legend { position: absolute; bottom: 14px; right: 14px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-variant-numeric: tabular-nums; }
.dim { position: absolute; transform: translate(-50%, -50%); background: var(--sel); color: #fff; font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; border-radius: 5px; pointer-events: none; white-space: nowrap; }
.dim[hidden] { display: none; }
.drop-hint { position: absolute; inset: 0; border: 3px dashed var(--accent); pointer-events: none; border-radius: 4px; }

.field-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.field input { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 7px; font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.field input:focus { background: var(--panel); border-color: var(--sel); outline: none; }
.unit { color: var(--muted); font-size: 11px; }
.section { display: flex; flex-direction: column; gap: 8px; padding-block: 14px; border-top: 1px solid var(--line); }
.section:first-child { border-top: 0; padding-top: 0; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kind { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.kind button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 500; }
.kind button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); }
.kind .sw-hole { width: 14px; height: 14px; border-radius: 3px; background: repeating-linear-gradient(45deg, var(--hole) 0 3px, transparent 3px 6px); border: 1px solid var(--hole); }
.kind .sw-solid { width: 14px; height: 14px; border-radius: 3px; background: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.help { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0; }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; line-height: 1.45; counter-increment: s; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
.steps b { font-weight: 600; }
.align-grid { display: grid; grid-template-columns: 74px repeat(3, 1fr); gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.align-grid button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 2px; font-size: 12px; color: var(--ink); }
.align-grid button:hover { border-color: var(--sel); }
.big { width: 100%; justify-content: center; padding: 10px; font-size: 15px; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.example-note { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
kbd.k { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: min(520px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 50; line-height: 1.4; }
.overlay { position: fixed; inset: 0; background: rgba(10,14,18,.45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.dialog { background: var(--panel); border-radius: 14px; max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dialog h3 { margin-bottom: 12px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
.sel { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 7px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-bottom: 14px; }
.stats div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats span { font-size: 11.5px; color: var(--muted); }
.stats b { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.checks { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; line-height: 1.45; font-size: 13.5px; }
.checks .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--panel); }
.checks .ok .ic { background: var(--ok); }
.checks .warn .ic { background: var(--warn); }
.checks .bad .ic { background: var(--bad); }
@media (max-width: 500px) { .stats { grid-template-columns: minmax(0,1fr); } }
.pe { position: absolute; inset: 0; z-index: 6; background: var(--panel); display: flex; flex-direction: column; }
.pe-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.pe-modes { display: inline-flex; gap: 2px; background: var(--panel-2); border-radius: 9px; padding: 3px; }
.pe-tpl { width: auto; }
.pe-img { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.pe-img input[type=number] { width: 70px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 4px 6px; font-family: var(--font-mono); }
.pe-canvas { position: relative; flex: 1 1 0; min-height: 0; background: var(--plate); overflow: hidden; }
#peSvg { width: 100%; height: 100%; display: block; touch-action: none; cursor: default; user-select: none; }
#peSvg .gm { stroke: var(--grid-minor); stroke-width: 1; }
#peSvg .gM { stroke: var(--grid-major); stroke-width: 1; }
#peSvg .ax { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
#peSvg .off { fill: var(--stage); opacity: .7; }
#peSvg .axl { fill: var(--muted); font: 600 12px var(--font-body); }
#peSvg .fill { fill: var(--accent); fill-opacity: .28; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
#peSvg .ghost { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-opacity: .35; stroke-dasharray: 4 4; }
#peSvg .ctrl { fill: none; stroke: var(--muted); stroke-opacity: .5; stroke-dasharray: 3 4; }
#peSvg .dot { fill: var(--panel); stroke: var(--ink); stroke-width: 2; cursor: grab; }
#peSvg .dot:hover { stroke: var(--sel); }
#peSvg .dot.small { stroke-width: 1.5; }
#peSvg .dot.sel { fill: var(--sel); stroke: var(--sel); }
#peSvg .add { cursor: copy; opacity: .55; }
#peSvg .add:hover { opacity: 1; }
#peSvg .add circle { fill: var(--panel); stroke: var(--sel); stroke-width: 1.5; }
#peSvg .add path { stroke: var(--sel); stroke-width: 1.8; stroke-linecap: round; }
#peSvg .coord { fill: var(--ink); font: 500 12px var(--font-mono); paint-order: stroke; stroke: var(--plate); stroke-width: 3px; }
.pe-warn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--warn); color: var(--warn); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; max-width: calc(100% - 24px); }
.pe-prev { position: absolute; right: 10px; bottom: 10px; width: 170px; height: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pe-prev canvas { width: 100%; height: 100%; display: block; }
.pe-prev span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; }
.pe-foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; padding: 10px; border-top: 1px solid var(--line); }
.pe-point, .pe-size, .pe-ex { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.pe-foot .field { width: 84px; }
#peHint { flex: 1 1 260px; margin: 0; }
.pe-done { margin-left: auto; }
.ask-btn { width: 100%; display: flex; align-items: center; gap: 8px; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font: inherit; font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer; }
.ask-btn svg { width: 18px; height: 18px; color: var(--accent); flex: 0 0 auto; }
.ask-btn:hover { border-style: solid; }
.dialog.ask { max-width: 640px; }
.dialog.acct { max-width: 440px; }
.acct-form { display: flex; flex-direction: column; gap: 10px; }
.acct-form .field input { font-family: var(--font-body); font-size: 14px; padding: 8px 9px; }
.acct-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.acct-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.acct-list li { display: grid; grid-template-columns: minmax(0,1fr) auto auto; grid-template-areas: "n o d" "w o d"; align-items: center; column-gap: 6px; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
.acct-list li.help { display: block; background: none; padding: 4px 0; }
.acct-list li.cur { outline: 2px solid var(--sel); outline-offset: -2px; }
.acct-list .acct-name { grid-area: n; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-list li > .help { grid-area: w; font-size: 12px; }
.acct-list li > .btn:nth-of-type(1) { grid-area: o; }
.acct-list li > .btn:nth-of-type(2) { grid-area: d; }
.acct-msg { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.acct-msg.bad { color: var(--bad); }
#askInput { width: 100%; border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 15px; color: var(--ink); margin-top: 6px; }
#askInput:focus { outline: none; border-color: var(--sel); background: var(--panel); }
.ask-sug { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; min-height: 30px; }
.ask-chip { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.ask-chip small { color: var(--muted); font-size: 11px; }
.ask-chip:hover { border-color: var(--accent); }
.ask-got-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; min-height: 48px; }
.ask-got { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 4px; }
.ask-got li { display: flex; gap: 8px; font-size: 13.5px; }
.ask-got li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.ask-skip { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.ask-skip span { text-decoration: line-through; background: var(--panel-2); border-radius: 4px; padding: 0 4px; }
.ask-miss { color: var(--bad); font-size: 13.5px; margin: 0; }
.ask-h { margin-top: 16px; }
.ask-exs { display: grid; gap: 6px; }
.ask-ex { text-align: left; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 7px 10px; font-family: var(--font-mono); font-size: 12.5px; cursor: pointer; overflow-wrap: anywhere; }
.ask-ex:hover { border-color: var(--accent); background: var(--accent-soft); }

@media (max-width: 860px) { .pe-prev { width: 110px; height: 90px; } .pe-foot .field { width: 72px; } }
.dialog.wide { max-width: 980px; }
.pic-modes { margin-bottom: 8px; flex-wrap: wrap; }
.pic-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin-top: 10px; }
.pic-left { min-width: 0; }
.pic-drop { border: 2px dashed var(--line); border-radius: 12px; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; }
.pic-drop p { margin: 0; }
#picCanvas { max-width: 100%; height: auto; display: block; border-radius: 8px; background: var(--panel-2); image-rendering: auto; }
.pic-opts { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pic-opts input[type=range] { width: 100%; }
.hf-table { display: grid; grid-template-columns: 38px minmax(0,1fr) 62px 74px 30px; gap: 4px 6px; align-items: center; }
.hf-table .hf-h { font-size: 11px; color: var(--muted); }
.hf-table input[type=text], .hf-table input[type=number] { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 4px 5px; font-size: 12.5px; }
.hf-table input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.swaps { margin: 0 0 6px; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.swaps li { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 8px; align-items: baseline; }
